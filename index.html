<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>월드 투어 3D</title>
<style>
:root{--panel:rgba(15,23,42,.84);--line:rgba(255,255,255,.1);--text:#f1f5f9;--muted:#94a3b8;--accent:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:radial-gradient(ellipse at 50% 0%,#24476b 0%,#0b1626 65%,#060b14 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
body.picking #c{cursor:crosshair}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
#players{position:fixed;top:12px;left:12px;width:240px;display:flex;flex-direction:column;gap:8px;z-index:5}
.pcard{padding:10px 12px;border-left:6px solid;transition:transform .25s,box-shadow .25s}
.pcard.active{box-shadow:0 0 0 2px var(--accent),0 12px 32px rgba(0,0,0,.4);transform:translateX(6px)}
.pcard.dead{opacity:.45;filter:grayscale(1)}
.pname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tag{font-size:10.5px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.12);color:#cbd5e1;font-weight:600}
.tag.red{background:#7f1d1d;color:#fecaca}.tag.blue{background:#0c4a6e;color:#bae6fd}.tag.gray{background:#374151;color:#e5e7eb}
.cash{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 14px;font-size:13px;z-index:5;white-space:nowrap}
#hud b{color:var(--accent)}
.ibtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer;font-family:inherit}
.ibtn:hover{background:rgba(255,255,255,.16)}
.ibtn.on{background:rgba(251,191,36,.2);border-color:rgba(251,191,36,.5)}
#log{position:fixed;top:12px;right:12px;width:270px;max-height:42vh;overflow-y:auto;padding:10px 12px;font-size:12.5px;line-height:1.5;z-index:5}
#log .ttl{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
#log .e{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 16px 12px 20px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#upPanel{position:fixed;top:50%;right:16px;width:min(350px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:20px;z-index:18;transform:translate(calc(100% + 40px),-50%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:rgba(15,23,42,.94)}
#upPanel.show{transform:translate(0,-50%)}
.upHd{display:flex;align-items:center;gap:12px}
.upCol{width:14px;height:44px;border-radius:5px;flex:none}
.upSub{font-size:12px;color:var(--muted);font-weight:700}
.upName{font-size:24px;font-weight:900}
.lvbar{display:flex;gap:4px;margin:14px 0}
.lvbar span{flex:1;height:34px;border-radius:7px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:16px;filter:grayscale(1);opacity:.5}
.lvbar span.done{background:rgba(251,191,36,.3);filter:none;opacity:1}
.lvbar span.next{outline:2px dashed #fbbf24;filter:none;opacity:1}
.upRow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.upRow span{color:var(--muted)}
.bigBtn{width:100%;font-size:19px;padding:16px;margin-top:12px;border-radius:12px}
.bigBtn small{font-size:13px}
.bigBtn.pulse{animation:pulse 1.2s infinite}
.upWarn{color:#f87171;font-size:13px;margin-top:6px;text-align:center;font-weight:700}
.upNote{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.5}
@media(max-width:760px){
  #upPanel{top:auto;bottom:12px;right:12px;width:auto;left:12px;max-height:70vh;transform:translateY(calc(100% + 40px))}
  #upPanel.show{transform:translateY(0)}
}
#autoBtn.on{background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.6)}
#turnName{font-weight:800;font-size:16px}
#diceResult{font-size:13px;color:var(--muted);min-width:130px;margin-top:2px}
.btn{font-family:inherit;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:#334155;color:#fff;transition:transform .1s,filter .15s;line-height:1.3}
.btn small{font-weight:600;opacity:.85;font-size:12px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#3b82f6,#2563eb)}
.btn.gold{background:linear-gradient(180deg,#f59e0b,#d97706)}
.btn.red{background:linear-gradient(180deg,#ef4444,#dc2626)}
#rollBtn{font-size:17px;padding:13px 26px;background:linear-gradient(180deg,#f59e0b,#d97706)}
#rollBtn.pulse{animation:pulse 1.2s infinite}
#rollBtn{display:none!important}
#log{display:none!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}50%{box-shadow:0 0 0 12px rgba(251,191,36,0)}}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);padding:10px 18px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:15;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;pointer-events:none;padding:10px 12px;font-size:12.5px;line-height:1.55;display:none;z-index:12;min-width:170px;max-width:240px}
.wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.55);z-index:20;padding:16px}
.modal{width:min(420px,100%);padding:20px;max-height:92vh;overflow:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns .btn{flex:1 1 120px}
.btns.many .btn{flex:1 1 30%;padding:8px 6px;font-size:13px}
.pc{border-radius:12px;overflow:hidden;background:#fffaf0;color:#1f2937}
.pc .hd{padding:14px;color:#fff;font-weight:800;font-size:21px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.pc .hd small{display:block;font-size:12px;font-weight:600;opacity:.95}
.pc table{width:100%;border-collapse:collapse;font-size:12.5px}
.pc td{padding:4px 12px;border-top:1px solid #eee}
.pc td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pc tr.cur td{background:#fef3c7;font-weight:700}
.pc tr.lm td{color:#a16207}
.msg{margin-top:12px;font-size:14px;line-height:1.55}
.card{border-radius:14px;padding:22px 18px;text-align:center;background:linear-gradient(160deg,#fde68a,#f59e0b);color:#3b2300;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.card .em{font-size:56px;line-height:1.1}
.flip{perspective:1100px;width:min(300px,78vw);height:min(400px,60vh);margin:0 auto;cursor:pointer}
.flip.open{cursor:default}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;box-sizing:border-box}
.flip .back{background:repeating-linear-gradient(45deg,rgba(251,191,36,.18) 0 2px,transparent 2px 16px),linear-gradient(160deg,#1e3a8a,#4c1d95);border:6px solid #fbbf24;color:#fde68a}
.flip .back .q{font-size:130px;font-weight:900;line-height:1;animation:qpop .6s ease-in-out infinite}
.flip .back .bl{font-size:20px;font-weight:800;margin-top:14px}
.flip .front{transform:rotateY(180deg)}
.flip.wig{animation:wig .9s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-14px) rotate(-6deg)}50%{transform:translateY(0) rotate(5deg)}75%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes qpop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.flipHint{text-align:center;margin-top:14px;font-weight:700;color:#fde68a;animation:qpop 1.2s ease-in-out infinite}
.card h3{margin:8px 0 6px;font-size:23px}
.card .who{font-size:12.5px;opacity:.8;margin-bottom:6px;font-weight:800}
.rank{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.rank td{padding:7px 6px;border-bottom:1px solid var(--line)}
.rank td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#pickBanner{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 14px;display:none;align-items:center;gap:12px;z-index:14;font-weight:700;white-space:nowrap}
#setup{display:none}
body.inLobby #players,body.inLobby #hud,body.inLobby #bar,body.inLobby #tip,body.inLobby #upPanel{display:none!important}
#intro{display:flex;z-index:19}
#lobbyUI{display:none}
#lbTop{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 14px;z-index:6;white-space:nowrap;font-size:14px}
#lbRooms{position:fixed;top:64px;left:12px;width:270px;padding:12px;z-index:6}
#lbRooms .ttl{font-weight:800;font-size:13px;color:var(--muted);margin-bottom:4px}
.rm{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.rm b{flex:none}.rm .st{flex:1;font-size:12px;color:var(--muted)}
.rm .btn{padding:6px 10px;font-size:12.5px}
.rm.me{background:rgba(251,191,36,.14);border-radius:8px}
#shopPrompt{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);padding:10px 18px;font-size:16px;font-weight:800;z-index:7;display:none;align-items:center;gap:10px;white-space:nowrap;animation:qpop 1.2s ease-in-out infinite}
#shopPrompt.show{display:flex}
#shopPrompt kbd{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:8px;background:#fbbf24;color:#1f1300;font:900 18px/1 inherit;box-shadow:0 3px 0 #b45309}
body.touch #shopPrompt{cursor:pointer}
#lbHint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 14px;font-size:12.5px;color:var(--muted);z-index:6;max-width:calc(100vw - 24px);text-align:center}
#roomPanel{position:fixed;top:50%;right:16px;transform:translateY(-50%);width:min(320px,calc(100vw - 32px));padding:16px;z-index:7;display:none}
#roomPanel h3{margin:0 0 6px;font-size:20px}
.timer{font-size:38px;font-weight:900;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.coinBig{font-size:20px;font-weight:900;color:var(--accent);margin:6px 0}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.shopItem{font-family:inherit;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:12px;padding:10px 6px;cursor:pointer;text-align:center;font-size:13px;font-weight:700}
.shopItem .em{font-size:30px;line-height:1.2}
.shopItem .pr{font-size:12px;color:var(--accent);margin-top:4px}
.shopItem.eq{border-color:#4ade80;background:rgba(74,222,128,.15)}
.shopItem.poor{opacity:.5}
.tag.job{background:rgba(251,191,36,.18);color:#fde68a;white-space:nowrap}
.shopItem:hover{filter:brightness(1.2)}
#shopWrap{z-index:21}
#itemBtns{display:flex;gap:8px;flex-wrap:wrap}
#itemBtns .btn{padding:9px 12px;font-size:13.5px}
@media(max-width:760px){
  #lbRooms{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:36vh;overflow:auto}
  #roomPanel{top:auto;bottom:12px;right:12px;left:12px;width:auto;transform:none;max-height:60vh;overflow:auto}
  #lbHint{display:none}
  #shopPrompt{bottom:auto;top:64px}
  #lbTop{font-size:12px;gap:8px}
}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input,select{font-family:inherit;background:#0f172a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.row input{flex:1;min-width:0}
.row select{width:auto}
.swatchBtn{flex:none;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.swatchBtn:hover{box-shadow:0 0 0 3px #fff}
.row input:disabled{opacity:.75;cursor:not-allowed}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06)}
.pal{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.pal.sel{box-shadow:0 0 0 3px #fff}
.pal:disabled{opacity:.2;cursor:not-allowed}
.swatch{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.seg{display:flex;gap:6px;margin-top:6px}
.seg .btn{flex:1}
.seg .btn.sel{background:linear-gradient(180deg,#3b82f6,#2563eb)}
h1{margin:0 0 4px;font-size:26px}
.lead{color:var(--muted);font-size:13px;margin:0 0 6px;line-height:1.5}
label.l{display:block;font-size:12px;color:var(--muted);margin-top:14px;font-weight:700}
.rules{font-size:13.5px;line-height:1.65}
.rules ul{padding-left:18px;margin:6px 0}
.netBox{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px;line-height:1.55}
.roomCode{font-size:32px;font-weight:900;letter-spacing:.22em;color:var(--accent);text-align:center;margin:4px 0}
.netMsg{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.5}
.netMsg.err{color:#f87171;font-weight:700}
.lobbyRow{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line)}
.lobbyRow.me{background:rgba(251,191,36,.14);border-radius:8px}
.lobbyRow .k{margin-left:auto;font-size:11.5px;color:var(--muted)}
#modeSeg .btn{font-size:13px;padding:9px 6px}
@media(max-width:760px){
  #players{right:12px;width:auto;flex-direction:row;overflow-x:auto}
  .pcard{min-width:150px;padding:8px 10px}
  .pcard.active{transform:none}
  .cash{font-size:15px}
  .hideM{display:none}
  #hud{top:auto;bottom:96px;font-size:12px;gap:8px;padding:6px 10px}
  #log{top:auto;bottom:146px;left:12px;right:12px;width:auto;max-height:64px;font-size:11.5px}
  #log .ttl{display:none}
  #bar{left:12px;right:12px;transform:none;justify-content:space-between;gap:10px;padding:10px 12px}
  #diceResult{min-width:0}
  #rollBtn{padding:12px 16px;font-size:15px}
  #toast,#pickBanner{top:112px}
}
</style>
</head>
<body class="inLobby">
<canvas id="c"></canvas>

<div id="players"></div>

<div id="hud" class="panel">
  <span class="hideM">🌍 <b>월드 투어 3D</b></span>
  <span>라운드 <b id="round">1</b></span>
  <button class="ibtn on" id="followBtn">📷 따라가기</button>
  <button class="ibtn" id="resetBtn">⟲ 시점</button>
  <button class="ibtn" id="helpBtn">❔ 규칙</button>
</div>

<div id="log" class="panel"><div class="ttl">게임 기록</div><div id="logList"></div></div>

<div id="bar" class="panel">
  <div><div id="turnName">-</div><div id="diceResult">게임 준비 중</div></div>
  <button class="btn" id="rollBtn" disabled>🎲 주사위 굴리기</button>
  <div id="itemBtns"><button class="btn" id="tacoBtn" style="display:none">🌮 타코 먹기</button><button class="btn" id="lemonBtn" style="display:none">🍋 레모네이드 마시기</button></div>
</div>

<div id="upPanel" class="panel"></div>

<div id="toast" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="pickBanner" class="panel"><span>🚌 버스로 갈 칸을 클릭하세요 (무료)</span><button class="btn red" id="pickCancel">안 가기</button></div>

<div class="wrap" id="modalWrap"><div class="modal panel"><div id="modalBody"></div><div class="btns" id="modalBtns"></div></div></div>

<div class="wrap" id="setup">
  <div class="modal panel" style="width:min(460px,100%)">
    <h1>🌍 월드 투어 3D</h1>
    <p class="lead">주사위를 굴려 세계의 도시를 사고, 땅을 10단계까지 키우고,<br>통행료로 상대를 파산시키세요!</p>
    <label class="l">플레이 방식</label>
    <div class="seg" id="modeSeg">
      <button class="btn sel" data-m="local">🖥️ 이 기기에서</button>
      <button class="btn" data-m="host">🌐 방 만들기</button>
      <button class="btn" data-m="join">🔑 방 참가</button>
    </div>
    <div id="netBox" class="netBox" style="display:none"></div>
    <div id="cfgBox">
    <label class="l">플레이어 수</label>
    <div class="seg" id="countSeg">
      <button class="btn" data-n="2">2명</button>
      <button class="btn" data-n="3">3명</button>
      <button class="btn sel" data-n="4">4명</button>
      <button class="btn" data-n="5">5명</button>
    </div>
    <label class="l">플레이어 설정</label>
    <div id="rows"></div>
    <div class="row" style="align-items:flex-start">
      <div style="flex:1"><label class="l">게임 길이</label>
        <select id="rounds"><option value="20">20 라운드</option><option value="30" selected>30 라운드</option><option value="50">50 라운드</option><option value="99">99 라운드</option><option value="0">무제한 (파산까지)</option></select></div>
      <div style="flex:1"><label class="l">진행 속도</label>
        <select id="speed"><option value="1">보통</option><option value="0.55">빠르게</option></select></div>
    </div>
    </div>
    <div class="netMsg" id="netMsg"></div>
    <div class="btns"><button class="btn" id="setupBack" style="flex:0 0 auto">← 로비로</button><button class="btn gold" id="startBtn" style="font-size:16px;padding:14px">게임 시작</button></div>
  </div>
</div>

<div class="wrap" id="intro">
  <div class="modal panel" style="width:min(420px,100%);text-align:center">
    <h1>🌍 월드 투어 3D</h1>
    <p class="lead">세계를 돌며 땅을 사고, 친구들과 대결하세요!</p>
    <div id="introBody"></div>
    <div class="netMsg" id="introMsg"></div>
    <div class="btns"><button class="btn gold" id="introBtn" style="font-size:17px;padding:14px">▶ 시작하기</button></div>
  </div>
</div>

<div id="lobbyUI">
  <div id="lbTop" class="panel"><span id="lbMe"></span><b id="lbCoins" style="color:var(--accent)"></b>
    <button class="ibtn" id="lbShopBtn">🛒 상점 가기</button><button class="ibtn" id="lbLocalBtn">🖥️ 이 기기에서 하기</button></div>
  <div id="lbRooms" class="panel"></div>
  <div id="lbHint" class="panel">⌨️ WASD·방향키로 걷기 · 바닥 클릭 = 그곳으로 걷기 · 스페이스바 = 점프 · 드래그 = 시점 회전 · 🚪 포탈에 들어가면 방 입장 · 🛒 가게 앞에서 <b>E</b> = 상점 열기</div>
  <div id="shopPrompt" class="panel"><kbd>E</kbd><span>🛒 상점 열기</span></div>
  <div id="roomPanel" class="panel"></div>
</div>

<div class="wrap" id="shopWrap"><div class="modal panel" style="width:min(540px,100%)"><div id="shopBody"></div>
  <div class="btns"><button class="btn primary" id="shopClose">닫기 (E)</button></div></div></div>

  ['#8e24aa', '보라'], ['#ec407a', '분홍'], ['#00acc1', '하늘'], ['#6d4c41', '갈색'], ['#c0ca33', '연두'],
];

const rand = (a, b) => a + Math.random() * (b - a);

const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// =====================================================================
//  온라인 동기화 (서버 없이 브라우저끼리 직접 연결 · PeerJS/WebRTC)
//  - 모든 기기가 같은 씨드로 같은 게임을 똑같이 진행 (주사위·카드·AI 선택은 grand())
//  - 사람의 선택만 방장을 거쳐 같은 순서로 모두에게 전달됨
// =====================================================================
let grand = Math.random; // 게임 결과에 영향을 주는 난수 (온라인에선 모두 같은 씨드)
function seedRng(a) {
  grand = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let NET = null; // 온라인 게임 중일 때: {me, hostId, isHost, post(ev)}
const evQ = []; let evWake = null;
function pushEv(ev) { evQ.push(ev); if (evWake) { const w = evWake; evWake = null; w(); } }
async function nextEv() { while (!evQ.length) await new Promise(r => evWake = r); return evQ.shift(); }
// 이 기기에서 직접 조작하는 사람 플레이어인가?
const isLocal = p => !p.ai && (!NET || p.ctrl === NET.me);
const ctrlOf = p => p.ai ? NET.hostId : p.ctrl;
// 선택 지점: 조작하는 기기에서 고르고, 모두가 같은 순서로 결과를 받음
async function decide(p, localFn, fallback, waitMsg) {
  if (!NET) return localFn();
  if (ctrlOf(p) === NET.me) { const v = await localFn(); NET.post({k: 'd', v: v === undefined ? null : v}); }
  else if (waitMsg) $('#diceResult').textContent = waitMsg;
  for (;;) {
    const ev = await nextEv();
    if (ev.k === 'd') return ev.v;
    if (ev.k === 'taco') eatTaco(players[ev.pid]);
    else if (ev.k === 'lemon') drinkLemonade(players[ev.pid]);
    else if (ev.k === 'leave') {
      const q = players[ev.pid];
      if (q && !q.ai) {
        q.ai = true; q.left = true;
        addLog(`🔌 ${nm(q)} 연결이 끊겨 컴퓨터가 대신합니다`); toast(`🔌 ${q.name} 연결 끊김 · 컴퓨터가 대신 플레이`); updateUI();
      }
      // 기다리던 사람이 나갔으면 방장이 기본값으로 대신 결정
      if (q === p && NET.isHost) NET.post({k: 'd', v: fallback === undefined ? null : fallback});
    }
  }
}
const waitTxt = (p, what) => `⏳ ${p.name}님이 ${what}…`;

  T('jail','감옥'),
  T('city','아테네','C',480000), T('chance','행운 카드'), T('city','코펜하겐','C',500000), T('city','스톡홀름','C',520000),
  T('tour','크루즈',null,600000),
  T('city','베른','D',640000), T('chance','행운 카드'), T('city','베를린','D',680000), T('city','오타와','D',720000),
  T('bus','버스'),
  T('city','부에노스아이레스','E',800000), T('chance','행운 카드'), T('city','상파울루','E',840000), T('city','시드니','E',880000),
  T('tour','그랜드캐니언',null,900000),
  T('city','하와이','F',960000), T('city','리스본','F',1000000), T('chance','행운 카드'), T('city','마드리드','F',1040000),

];
TILES.forEach((t, i) => t.idx = i);

function costTo(from, to) { let c = 0; for (let L = from + 1; L <= to; L++) c += STEP[L]; return c; }
function tileValue(t) { return t.price + costTo(1, t.level); }
const rentAt = (t, L) => roundK(t.price * RM[L]);
function hasMonopoly(t) {
  if (t.type !== 'city' || t.owner == null) return false;
  return TILES.filter(x => x.g === t.g).every(x => x.owner === t.owner);
}
function rent(t) {
  if (t.type === 'tour') {
    const n = TILES.filter(x => x.type === 'tour' && x.owner === t.owner).length;
    return roundK(t.price * 0.3 * n);
  }
  let r = rentAt(t, t.level);
  if (hasMonopoly(t)) r = roundK(r * 1.5);
  return r;
}

function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; return t; }
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
function fitFont(g, txt, size, maxW, weight = 'bold') {
  let s = size;
  do { g.font = `${weight} ${s}px ${FONT}`; s -= 2; } while (g.measureText(txt).width > maxW && s > 10);
}
function wrapText(g, text, x, y, maxW, lh) {
  const lines = []; let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch.trim() ? ch : ''; }
    else line += ch;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => g.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
}

function makeTileTexture(t) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#fffaf0'; g.fillRect(0, 0, 256, 256);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const corner = {
    start:  ['#c8e6c9', '🏁', '출발', '월급 100만'],
    island: ['#b3e5fc', '🏝️', '섬', '1턴 휴식 · 🍋'],
    jail:   ['#cfd8dc', '🚔', '감옥', '3턴 수감 · 더블 탈출'],
    bus:    ['#fff59d', '🚌', '버스', '원하는 곳으로'],
    tax:    ['#ffcdd2', '🧾', '세금', '30만 납부'],
  };

    g.fillStyle = GC[t.g]; g.fillRect(0, 0, 256, 72);
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(0, 62, 256, 10);
    g.fillStyle = '#222'; fitFont(g, t.name, 48, 236); g.fillText(t.name, 128, 138);
    g.fillStyle = '#777'; fitFont(g, fmtShort(t.price), 32, 236, '600'); g.fillText(fmtShort(t.price), 128, 206);
  } else if (t.type === 'tour') {
    const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, '#f59e0b'); gr.addColorStop(1, '#fcd34d');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 72);
    g.fillStyle = '#5b3a00'; fitFont(g, '★ 관광지', 30, 236); g.fillText('★ 관광지', 128, 38);
    g.fillStyle = '#222'; fitFont(g, t.name, 46, 236); g.fillText(t.name, 128, 138);
    g.fillStyle = '#777'; fitFont(g, fmtShort(t.price), 32, 236, '600'); g.fillText(fmtShort(t.price), 128, 206);
  } else if (t.type === 'chance') {
    g.fillStyle = '#fff3c4'; g.fillRect(0, 0, 256, 256);
    g.fillStyle = '#f59e0b'; g.font = 'bold 130px sans-serif'; g.fillText('?', 128, 112);
    g.fillStyle = '#8a5a00'; fitFont(g, '행운 카드', 34, 236); g.fillText('행운 카드', 128, 212);

    g.fillStyle = '#1f2937'; fitFont(g, name, 44, 236); g.fillText(name, 128, 170);
    g.fillStyle = '#555'; fitFont(g, sub, 26, 236, '600'); g.fillText(sub, 128, 216);
  }
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 5; g.strokeRect(2.5, 2.5, 251, 251);
  return canvasTex(c);
}

function makeCenterTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(512, 512, 60, 512, 512, 720);
  gr.addColorStop(0, '#2f8a74'); gr.addColorStop(1, '#173f37');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2;
  for (let r = 120; r < 760; r += 90) { g.beginPath(); g.arc(512, 512, r, 0, Math.PI * 2); g.stroke(); }
  for (let a = 0; a < 16; a++) {
    g.beginPath(); g.moveTo(512, 512);
    g.lineTo(512 + Math.cos(a * Math.PI / 8) * 800, 512 + Math.sin(a * Math.PI / 8) * 800); g.stroke();
  }
  // 카드 놓는 자리
  g.save(); g.translate(512 + 3.9 / 14.3 * 1024, 512 - 3.9 / 14.3 * 1024);
  g.strokeStyle = 'rgba(253,230,138,.55)'; g.setLineDash([14, 10]); g.lineWidth = 5;
  g.strokeRect(-62, -88, 124, 176); g.restore();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  const TITLE = '완전 엄청 평범한 보드게임';
  g.fillStyle = '#fde68a'; fitFont(g, TITLE, 100, 900, '900'); g.fillText(TITLE, 512, 400);
  return canvasTex(c);
}

function grid(i) {
  if (i <= 10) return [5 - i, 5];
  if (i <= 20) return [-5, 5 - (i - 10)];
  if (i <= 30) return [-5 + (i - 20), -5];
  return [5, -5 + (i - 30)];
}
function tilePos(i) { const [gx, gz] = grid(i); return new THREE.Vector3(gx * S, 0.2, gz * S); }
function tileRot(i) { if (i < 10) return 0; if (i < 20) return -Math.PI / 2; if (i < 30) return Math.PI; return Math.PI / 2; }

trim.position.y = -0.62; scene.add(trim);

// ---- 주사위
const PIPS = {
  1: [[.5,.5]], 2: [[.27,.27],[.73,.73]], 3: [[.27,.27],[.5,.5],[.73,.73]],
  4: [[.27,.27],[.73,.27],[.27,.73],[.73,.73]], 5: [[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],
  6: [[.27,.24],[.73,.24],[.27,.5],[.73,.5],[.27,.76],[.73,.76]],
};
function diceFaceTex(n) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fbfbfb'; g.fillRect(0, 0, 128, 128); // 둥근 모서리에 회색 테두리가 보이지 않도록 전체 흰색
  g.fillStyle = n === 1 ? '#d32f2f' : '#1f2937';
  PIPS[n].forEach(([x, y]) => { g.beginPath(); g.arc(x * 128, y * 128, n === 1 ? 17 : 11.5, 0, Math.PI * 2); g.fill(); });
  return canvasTex(c);
}
const FACE_ORDER = [2, 5, 1, 6, 3, 4]; // +x, -x, +y, -y, +z, -z
const diceMats = FACE_ORDER.map(n => new THREE.MeshStandardMaterial({map: diceFaceTex(n), roughness: 0.35}));
const DS = 1.6; // 주사위 한 변 길이 (크게)
// 모서리가 둥근 정육면체: 잘게 나눈 상자의 꼭짓점을 안쪽 상자 + 반지름 r 만큼 둥글게 밀어냄
function roundedBoxGeo(size, r, seg) {
  const geo = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const h = size / 2 - r, v = new THREE.Vector3(), inner = new THREE.Vector3(), d = new THREE.Vector3();
  for (let k = 0; k < pos.count; k++) {
    v.fromBufferAttribute(pos, k);
    inner.set(clamp(v.x, -h, h), clamp(v.y, -h, h), clamp(v.z, -h, h));
    d.subVectors(v, inner).normalize();
    v.copy(inner).addScaledVector(d, r);
    pos.setXYZ(k, v.x, v.y, v.z); nor.setXYZ(k, d.x, d.y, d.z);
  }
  pos.needsUpdate = nor.needsUpdate = true;
  return geo;
}
const dice = [0, 1].map(k => {
  const m = new THREE.Mesh(roundedBoxGeo(DS, DS * 0.15, 16), diceMats);
  m.castShadow = true; m.rotation.order = 'YXZ';
  m.position.set(k ? 1.2 : -1.2, DS / 2, 2.3); m.rotation.y = k ? 0.4 : -0.3;

async function driveStraight(veh, from, to, onStep) {

  await tween(Math.max(380, len / S * 105) * SPEED, k => {

    if (onStep) onStep();
  });
}

// ---- 하늘에서 떨어지기 (타코비 / 동전비)
async function rainFrom(makeFn, count, dur) {
  const items = [];
  for (let k = 0; k < count; k++) {
    const m = makeFn();
    const it = {m, x: rand(-9.5, 9.5), z: rand(-9.5, 9.5), y0: rand(9, 16), delay: rand(0, 1.0),
      rs: new THREE.Vector3(rand(-6, 6), rand(-6, 6), rand(-6, 6)), floor: 0.25 + rand(0, 0.1), landed: -1};
    m.position.set(it.x, it.y0, it.z); scene.add(m); items.push(it);
  }
  const prevR = cam.r; cam.r = Math.max(cam.r, 30); camOverride = new THREE.Vector3(0, 0, 0);
  await tween(dur * SPEED, k => {
    const time = k * dur / 1000;
    items.forEach(it => {
      const tt = Math.max(0, time - it.delay);
      let y = it.y0 - 0.5 * 9.8 * tt * tt;
      if (y <= it.floor) { if (it.landed < 0) it.landed = tt; y = it.floor + Math.abs(Math.sin((tt - it.landed) * 9)) * 0.4 * Math.exp(-(tt - it.landed) * 4); }
      else it.m.rotation.set(it.rs.x * tt, it.rs.y * tt, it.rs.z * tt);
      it.m.position.y = y;
      if (k > 0.82) it.m.scale.setScalar(Math.max(0.001, (1 - k) / 0.18) * (it.m.userData.s || 1));
    });
  });
  items.forEach(it => scene.remove(it.m));
  cam.r = prevR; camOverride = null;
}

const tweens = [];

}

function animate(now) {
  requestAnimationFrame(animate);
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; const k = Math.min(1, (now - tw.start) / tw.dur);
    tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  if (globeMesh && !flipped) globeMesh.rotation.y += 0.015;
  if (active && active.pawn && !active.bankrupt && !flipped) {
    marker.visible = true;
    marker.position.set(active.pawn.position.x, active.pawn.position.y + 1.25 + Math.sin(now / 250) * 0.08, active.pawn.position.z);
    marker.rotation.y = now / 600;

  if (camOverride) cam.goal.copy(camOverride);
  else if (follow && active && active.pawn) cam.goal.copy(active.pawn.position).multiplyScalar(0.55).setY(0);
  else cam.goal.set(0, 0, 0);
  cam.target.lerp(cam.goal, 0.05);
  const sp = Math.sin(cam.phi);
  camera.position.set(cam.target.x + cam.r * sp * Math.sin(cam.theta), cam.target.y + cam.r * Math.cos(cam.phi), cam.target.z + cam.r * sp * Math.cos(cam.theta));
  camera.lookAt(cam.target);
  if (shakeAmt > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shakeAmt));
  if (lobbyOn) { lobbyTick(now); renderer.render(lobbyScene, lobbyCam); }
  else renderer.render(scene, camera);
}

const pointers = new Map(); let dragMoved = 0, pinchDist = 0;
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pdist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY}); dragMoved = 0;
  if (pointers.size === 2) pinchDist = pdist();
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId);
  if (prev) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y; prev.x = e.clientX; prev.y = e.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (pointers.size === 1) { cam.theta -= dx * 0.006; cam.phi = clamp(cam.phi - dy * 0.005, 0.18, 1.35); }
    else if (pointers.size === 2) { const d = pdist(); cam.r = clamp(cam.r * pinchDist / d, 9, 50); pinchDist = d; }
    if (dragMoved > 6) hideTip();
  } else if (e.pointerType === 'mouse' && !lobbyOn) hoverAt(e);
});
const endPtr = e => {
  const had = pointers.has(e.pointerId); pointers.delete(e.pointerId);
  if (had && e.type === 'pointerup' && dragMoved < 7 && pointers.size === 0) clickAt(e);
};
canvas.addEventListener('pointerup', endPtr);

// =====================================================================
//  이동
// =====================================================================
function faceToward(p, to) {
  const d = to.clone().sub(p.pawn.position);
  if (d.lengthSq() > 1e-4) p.pawn.rotation.y = Math.atan2(d.x, d.z);
}
async function hop(p, to, dur = 190) {
  const from = p.pawn.position.clone(), end = pawnSpot(p.id, to);
  faceToward(p, end);
  await tween(dur * SPEED, t => {
    p.pawn.position.lerpVectors(from, end, t); p.pawn.position.y = 0.2 + Math.sin(t * Math.PI) * 0.35;
    poseWalk(p.pawn, t);
  });
  poseWalk(p.pawn, 0);
  if (p.pawn.userData.taco) p.pawn.userData.armR.rotation.x = -0.6;
  if (p.pawn.userData.lemon) p.pawn.userData.armL.rotation.x = -0.6;
}
function passStart(p) {
  const amt = Math.round(SALARY * (p.job === 'office' ? 1.35 : 1)) * earnMul(p);
  p.cash += amt; floatMoney(p, amt);
  addLog(`${nm(p)} 출발지 통과! 월급 ${fmt(amt)}${p.job === 'office' ? ' (💼 회사원 ×1.35)' : ''}`); updateUI();
}
async function moveSteps(p, n) {
  for (let k = 0; k < n; k++) { const to = (p.pos + 1) % 40; await hop(p, to); p.pos = to; if (to === 0) passStart(p); }
}
async function moveForwardTo(p, target) {
  while (p.pos !== target) { const to = (p.pos + 1) % 40; await hop(p, to, 100); p.pos = to; if (to === 0) passStart(p); }
}
async function moveBack(p, n) {
  for (let k = 0; k < n; k++) { const to = (p.pos + 39) % 40; await hop(p, to); p.pos = to; }
}
// 말이 최소 거리(직선·대각선·뒤로)로 통통 걸어서 이동
async function goShortest(p, to) {
  const from = p.pawn.position.clone(), end = pawnSpot(p.id, to);
  const n = Math.max(1, Math.round(from.distanceTo(end) / S));
  faceToward(p, end);
  for (let k = 0; k < n; k++) {
    const a = from.clone().lerp(end, k / n), b = from.clone().lerp(end, (k + 1) / n);
    await tween(130 * SPEED, t => { p.pawn.position.lerpVectors(a, b, t); p.pawn.position.y = 0.2 + Math.sin(t * Math.PI) * 0.35; poseWalk(p.pawn, t); });
  }
  poseWalk(p.pawn, 0); p.pawn.position.copy(end);
  if (p.pawn.userData.taco) p.pawn.userData.armR.rotation.x = -0.6;
  if (p.pawn.userData.lemon) p.pawn.userData.armL.rotation.x = -0.6;
  p.pos = to;
}
// 아주 많이 뒤로: 40칸마다 한 바퀴는 회오리로 한 번에, 나머지는 한 칸씩
async function moveBackMany(p, n) {
  const laps = Math.floor(n / 40), rest = n % 40;
  if (laps > 0) {
    toast(`🌀 ${p.name} 판을 거꾸로 ${laps}바퀴!`);
    const c = p.pawn.position.clone();
    await tween(Math.min(3000, 700 + laps * 90) * SPEED, k => { p.pawn.rotation.y = -k * Math.min(laps, 12) * Math.PI * 2; p.pawn.position.y = c.y + Math.sin(k * Math.PI) * 1.6; });
    p.pawn.position.copy(c); p.pawn.rotation.y = 0;
  }
  for (let k = 0; k < rest; k++) { const to = (p.pos + 39) % 40; await hop(p, to, rest > 12 ? 110 : 190); p.pos = to; }
}
async function flyTo(p, to) {
  const from = p.pawn.position.clone(), end = pawnSpot(p.id, to);
  await tween(1000 * SPEED, t => {
    const e = easeOut(t); p.pawn.position.lerpVectors(from, end, e);
    p.pawn.position.y = 0.2 + Math.sin(t * Math.PI) * 4; p.pawn.rotation.y = t * Math.PI * 4;
  });
  p.pawn.rotation.y = 0; p.pos = to;
}

async function animateDice(a, b) {
  const vals = [a, b];
  const data = dice.map((d, k) => {
    const [ux, uz] = UP[vals[k]];
    const e = new THREE.Vector3((k ? 1.2 : -1.2) + rand(-0.2, 0.2), DS / 2, 2.3 + rand(-0.3, 0.3));
    const s = new THREE.Vector3(e.x + rand(-1.5, 1.5), 4.8, e.z + 5.5);

  });

    const e = easeOut(t);

const earnMul = p => p && p.job === 'gold' ? 2 : 1;
const loseMul = p => p && p.job === 'gold' ? 2 : 1;
const dirtMul = p => p && p.job === 'dirt' ? 2 : 1;

async function liquidate(p, need) {
  const own = TILES.filter(t => t.owner === p.id).sort((a, b) => tileValue(a) - tileValue(b));
  let sold = 0;
  for (const t of own) {
    if (p.cash >= need) break;
    const v = roundK(tileValue(t) * 0.5);
    p.cash += v; t.owner = null; t.level = 0; updateTile(t.idx); sold++;
    addLog(`${nm(p)} 돈이 부족해 ${t.name} 매각 (+${fmt(v)})`);
  }
  if (sold) { toast(`💸 ${p.name}: 땅 ${sold}개를 급매했습니다`); updateUI(); await sleep(700); }
}
// to: 플레이어 | 'bank'
async function pay(p, amount, to) {
  if (amount <= 0) return true;
  amount *= loseMul(p);
  if (p.cash < amount) await liquidate(p, amount);
  if (p.cash >= amount) {
    p.cash -= amount; floatMoney(p, -amount);
    if (to && typeof to === 'object') { const got = amount * earnMul(to); to.cash += got; floatMoney(to, got); }
    updateUI(); return true;
  }
  if (to && typeof to === 'object') to.cash += p.cash;
  p.cash = 0;
  await bankrupt(p);
  return false;
}
async function bankrupt(p) {

// 버스: 원하는 칸으로 이동 (무료)
function aiBusPick(p) {
  const cand = [];
  TILES.forEach((t, i) => {
    if (i === 20) return;
    if ((t.type === 'city' || t.type === 'tour') && t.owner == null && p.cash - t.price > 600000) cand.push([t.price, i]);
    else if (t.type === 'city' && t.owner === p.id && t.level < 9 && p.cash > 1500000) cand.push([t.price * 0.8, i]);
  });
  // 가장 비싼 곳(서울)만 고르지 않고, 갈 만한 칸 중에서 무작위로 고름
  if (cand.length) return cand[Math.floor(grand() * cand.length)][1];
  const any = TILES.map((t, i) => i).filter(i => i !== 20);
  return any[Math.floor(grand() * any.length)];
}

function pickCard() {
  const total = CARDS.reduce((s, c) => s + c.w, 0);
  let r = grand() * total;
  for (const c of CARDS) { if ((r -= c.w) < 0) return c; }
  return CARDS[CARDS.length - 1];
}

async function takeTurn(p) {
  setActive(p);
  // 온라인: 차례가 시작될 때 모든 기기가 여기서 한 번 맞춰짐 (타코·연결 끊김도 이때 반영)
  if (NET) await decide(p, () => 'turn', 'turn', '⏳ 다른 플레이어를 기다리는 중…');
  await sleep(p.ai ? 450 : 150);
  // 🛒 마트 직원: 딱 7단계(마트)인 건물이 하나라도 있으면 매 턴 70만원 (8단계 이상은 해당 없음)
  if (p.job === 'mart' && TILES.some(t => t.owner === p.id && t.level === 7)) {
    const amt = 700000 * earnMul(p);
    p.cash += amt; floatMoney(p, amt);
    addLog(`🛒 ${nm(p)} 마트 직원 월급 +${fmt(amt)}`); toast(`🛒 ${p.name} 마트 직원 월급 +${fmt(amt)}`); updateUI(); await sleep(500);
  }
  let doubles = 0;
  rollAgain = 0;
  // 감옥: 더블로만 탈출
  if (p.jail > 0) {
    if (p.ai) await sleep(400);
    else { $('#diceResult').textContent = `🚔 감옥 탈출 시도 (남은 ${p.jail}턴, 더블 필요)…`; await sleep(800); }
    const [a, b] = await rollDice(p, true);
    if (a === b) {
      p.jail = 0; addLog(`🎉 ${nm(p)} 더블로 감옥 탈출!`); toast(`🎉 더블! ${p.name} 탈옥 성공!`); updateUI();
      await moveSteps(p, a + b); await land(p);
    } else {
      p.jail--; addLog(`${nm(p)} 탈출 실패… ${p.jail ? `(남은 ${p.jail}턴)` : '(다음 턴 석방)'}`); toast('🚔 탈출 실패…'); updateUI(); await sleep(700);
    }
    return;
  }
  // 섬: 1턴 쉬기
  if (p.island > 0) {
    p.island = 0;
    $('#diceResult').textContent = '🏝️ 섬에서 레모네이드를 마시며 쉬는 중…';
    addLog(`🏝️ ${nm(p)} 섬에서 한 턴 쉽니다 🍋`); toast(`🏝️ ${p.name} 섬에서 휴식 중… 🍋`);
    updateUI(); await sleep(1300);
    return;
  }
  const haunted = p.ghost > 0;
  if (haunted) { p.ghost--; addLog(`👻 ${nm(p)} 귀신이 따라다니는 중… (남은 ${p.ghost}턴)`); updateUI(); }
  while (!gameOver && !p.bankrupt) {
    const [a, b] = await rollDice(p);
    if (a === b && ++doubles >= 3) { addLog(`🚨 ${nm(p)} 3연속 더블! 과속으로 감옥행`); toast('🚨 3연속 더블! 감옥으로!'); await sendToJail(p); return; }
    pendingDouble = a === b;
    let total = a + b;
    if (p.job === 'santa' && grand() < 0.1) {
      total *= 2;
      $('#diceResult').textContent = `🎅 산타의 선물! ${a + b} × 2 = ${total}`;
      addLog(`🎅 ${nm(p)} 산타의 선물! 주사위 ${a + b} → <b>${total}</b>`); toast(`🎅 산타의 선물! ${a + b} → ${total}칸`); await sleep(700);
    }
    if (haunted) {
      const minus = 1 + Math.floor(grand() * 100), steps = total - minus;
      $('#diceResult').textContent = `👻 ${total} − ${minus} = ${steps}`;
      addLog(`👻 귀신이 ${minus}칸을 빼갔다! ${total} − ${minus} = <b>${steps}</b>`);
      toast(`👻 −${minus}! ${steps >= 0 ? `${steps}칸 앞으로` : `${-steps}칸 뒤로`}`); await sleep(800);
      if (steps >= 0) await moveSteps(p, steps); else await moveBackMany(p, -steps);
    } else await moveSteps(p, total);
    await land(p);
    updateUI();
    if (a === b && p.island === 0 && p.jail === 0 && !p.bankrupt && !gameOver) {
      rollAgain = doubles;
      addLog(`🎲 ${nm(p)} 더블! 한 번 더 굴립니다`);
      toast(`🎲 더블! ${p.name} 한 번 더!`); await sleep(700); continue;
    }
    rollAgain = 0;
    return;
  }
}
async function gameLoop() {
  while (!gameOver) {
    const p = players[cur];
    if (!p.bankrupt) await takeTurn(p);
    if (gameOver) break;
    cur = (cur + 1) % players.length;
    if (cur === 0) {
      round++;
      if (round > maxRounds) { endGame(`${maxRounds}라운드 종료! 총자산 1위가 승리합니다.`); break; }
      addLog(`<span style="color:#94a3b8">── 라운드 ${round} ──</span>`);
      updateUI();
    }
  }
}
function endGame(reason) {

  if (pickMode) { const r = pickResolver; closePick(); r && r(null); }
  setActive(null); $('#rollBtn').disabled = true;
  const rank = [...players].sort((a, b) => (a.bankrupt - b.bankrupt) || (assetOf(b) - assetOf(a)));

  const me = NET ? players.find(isLocal) : players.find(p => p.me);
  let coinTxt = '';
  if (me && profile) {
    const c = coinOf(rank.indexOf(me));
    profile.coins += c; saveProfile();

  }
  setTimeout(() => modal(`<div class="card"><div class="em">🏆</div><h3>${esc(w.name)} 승리!</h3><div>${reason}</div></div>
    <table class="rank">${rank.map((p, i) => `<tr><td>${['🥇','🥈','🥉','4위','5위'][i]}</td><td>${nm(p)}${p.bankrupt ? ' <span class="tag red">파산</span>' : ''}${p.tacos ? ` 🌮${p.tacos}` : ''}${p.lemonade ? ` 🍋${p.lemonade}` : ''}</td><td>${fmt(p.bankrupt ? 0 : assetOf(p))}<br><small style="color:var(--accent)">🪙${coinOf(i)}</small></td></tr>`).join('')}</table>${coinTxt}`,

}

const peerReady = () => {
  if (typeof Peer !== 'undefined') return true;
  netMsg('온라인 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.', true);
  return false;
};
function makeCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let k = 0; k < 5; k++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
function copyText(text, what) {
  const ok = () => netMsg(`${what}를 복사했어요! 친구에게 보내 주세요.`);
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => netMsg(`복사가 안 되면 직접 알려 주세요: ${text}`));
  else netMsg(`직접 알려 주세요: ${text}`);
}

// ---- 방장
function openHost(tries = 0) {
  if (!peerReady()) return;
  const code = makeCode();
  const peer = new Peer(ROOM_PREFIX + code);
  const lb = lobby = {isHost: true, peer, code, id: null, guests: new Map()};
  const canLink = location.protocol.startsWith('http');
  $('#netBox').innerHTML = `
    <div style="text-align:center;color:var(--muted);font-weight:700;font-size:12px">방 코드</div>
    <div class="roomCode" id="roomCode">· · ·</div>
    <div class="row"><button type="button" class="btn" id="copyCode" style="flex:1">📋 코드 복사</button>${canLink ? '<button type="button" class="btn" id="copyLink" style="flex:1">🔗 초대 링크 복사</button>' : ''}</div>
    <div class="netMsg" id="hostStatus">방을 만드는 중…</div>
    <div class="netMsg">친구는 같은 게임 파일을 열고 <b>[🔑 방 참가]</b>에서 코드를 입력하면 돼요.<br>아래에서 친구 자리를 <b>🌐 온라인</b>으로 바꿔 두세요.</div>`;
  $('#copyCode').onclick = () => lb.id && copyText(code, '방 코드');
  if (canLink) $('#copyLink').onclick = () => lb.id && copyText(location.href.split('#')[0] + '#room=' + code, '초대 링크');
  peer.on('open', id => {
    if (lobby !== lb) return;
    lb.id = id; $('#roomCode').textContent = code; broadcastLobby();
  });
  peer.on('error', err => {
    if (lobby !== lb) return;
    if (err.type === 'unavailable-id' && tries < 5) { lobby = null; peer.destroy(); openHost(tries + 1); return; }
    if (err.type === 'peer-unavailable') return;
    if (started) toast('🔌 연결 오류: ' + err.type);
    else netMsg('연결 오류(' + err.type + '). 잠시 후 다시 시도해 주세요.', true);
  });
  peer.on('disconnected', () => { if (lobby === lb && !peer.destroyed) peer.reconnect(); });
  peer.on('connection', conn => {
    conn.on('data', d => hostOnData(lb, conn, d));
    conn.on('close', () => hostOnClose(lb, conn));
  });
}
function hostOnData(lb, conn, d) {
  if (lobby !== lb || !d) return;
  if (d.t === 'hello') {
    const deny = msg => { try { conn.send({t: 'deny', msg}); } catch (e) {} setTimeout(() => conn.close(), 400); };
    if (started) return deny('이미 게임이 시작됐어요.');
    const i = setupCfg.findIndex((c, k) => k < setupCount && c.net && !c.peer);
    if (i < 0) return deny("빈 온라인 자리가 없어요. 방장에게 자리를 '🌐 온라인'으로 바꿔 달라고 하세요.");
    setupCfg[i].peer = conn.peer;
    setupCfg[i].netName = String(d.name || '').trim().slice(0, 10) || `플레이어 ${i + 1}`;
    lb.guests.set(conn.peer, {conn});
    renderRows();
    return;
  }
  if (d.t === 'ev' && started && NET && lb.guests.has(conn.peer) && d.ev) {
    const me = players.find(p => p.ctrl === conn.peer);
    if (!me || me.ai) return;
    if (d.ev.k === 'taco') NET.post({k: 'taco', pid: me.id});
    else if (d.ev.k === 'lemon') NET.post({k: 'lemon', pid: me.id});
    else if (d.ev.k === 'd') NET.post({k: 'd', v: d.ev.v === undefined ? null : d.ev.v});
  }
}
function hostOnClose(lb, conn) {
  if (lobby !== lb || !lb.guests.has(conn.peer)) return;
  lb.guests.delete(conn.peer);
  if (!started) { renderRows(); return; }
  const p = players.find(q => q.ctrl === conn.peer);
  if (p && !p.ai) NET.post({k: 'leave', pid: p.id});
}
// 자리에서 빠졌거나 나간 참가자 정리
function reconcileSeats() {
  if (!lobby || !lobby.isHost || started) return;
  for (const [pid, g] of lobby.guests) {
    const seated = setupCfg.some((c, k) => k < setupCount && c.net && c.peer === pid);
    if (!seated) {
      lobby.guests.delete(pid);
      try { g.conn.send({t: 'deny', msg: '방장이 자리를 바꿔서 방에서 나왔어요.'}); } catch (e) {}
      setTimeout(() => g.conn.close(), 400);
    }
  }
  setupCfg.forEach(c => { if (c.peer && !lobby.guests.has(c.peer)) { c.peer = null; c.netName = ''; } });
}
function lobbyRows() {
  return setupCfg.slice(0, setupCount).map((c, i) => ({
    name: c.ai ? aiNameOf(i) : c.net ? c.netName : (c.name.trim() || `플레이어 ${i + 1}`),
    color: c.color, kind: kindOf(c), filled: !c.net || !!c.peer, peer: c.peer,
  }));
}
function broadcastLobby() {
  if (MODE !== 'host' || !lobby || !lobby.isHost || started) return;
  const rows = lobbyRows();
  const net = rows.filter(r => r.kind === 'net'), joined = net.filter(r => r.filled).length;
  const st = $('#hostStatus');
  if (st && lobby.id) st.textContent = net.length
    ? `온라인 참가 ${joined} / ${net.length}명${joined < net.length ? ' · 친구를 기다리는 중…' : ' · 모두 들어왔어요! 게임을 시작하세요'}`
    : "'🌐 온라인' 자리가 없어요";
  const info = `${$('#rounds').selectedOptions[0].text} · 속도 ${$('#speed').selectedOptions[0].text}`;
  for (const [pid, g] of lobby.guests) {
    try { g.conn.send({t: 'lobby', rows: rows.map(({peer, ...r}) => r), me: rows.findIndex(r => r.peer === pid), info}); } catch (e) {}
  }
}

function joinRoom() {

  if (!code) { netMsg('방 코드를 입력하세요', true); return; }

  closeLobby();

  };

    conn.on('data', d => guestOnData(lb, d));
    conn.on('close', () => guestOnClose(lb));
  });
  peer.on('error', err => {

    clearTimeout(timer);
    fail(err.type === 'peer-unavailable' ? '방을 찾을 수 없어요. 코드를 확인해 주세요.' : `연결 오류(${err.type}). 다시 시도해 주세요.`);

}

function startGame(cfg, net) {
  if (started) return;
  started = true;
  NET = net;
  maxRounds = cfg.maxRounds || Infinity;
  SPEED = cfg.speed || 1;
  if (net) seedRng(cfg.seed);
  players = cfg.players.map((c, i) => ({
    id: i, name: c.name, ai: c.ai, color: c.color, ctrl: c.ctrl, left: false, me: !!c.me, hat: SHOP_IDS.has(c.hat) ? c.hat : null, job: JOB_IDS.has(c.job) ? c.job : 'newbie', shape: SHAPES.has(c.shape) ? c.shape : 'ball',
    cash: START_CASH, pos: 0, island: 0, jail: 0, freePass: 0, tacos: 0, lemonade: 0, ghost: 0, bankrupt: false, pawn: null,
  }));
  players.forEach(p => {
    p.pawn = makePerson(p.color, p.shape); p.pawn.position.copy(pawnSpot(p.id, 0)); p.pawn.rotation.y = -Math.PI / 2;
    dressPawn(p.pawn, p.hat);
  });
  $('#setup').style.display = 'none';
  hideLobby(); cam.theta = 0.42; cam.phi = 0.88; cam.r = 25;
  addLog(`게임 시작! 시작 자금 ${fmt(START_CASH)}`);
  if (net) { const me = players.find(isLocal); toast(`🌐 온라인 게임 시작!${me ? ` 나는 ${me.name}` : ''}`); }
  updateUI();
  gameLoop();
}

  if (profile && typeof profile.name === 'string' && profile.name.trim()) {
    profile.coins = Math.max(0, profile.coins | 0);
    profile.owned = Array.isArray(profile.owned) ? profile.owned : [];
    if (!/^#[0-9a-f]{6}$/i.test(profile.color || '')) profile.color = PALETTE[0][0];

}

function makeLabel(text, bg, w = 2.4) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 112;
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false}));
  sp.scale.set(w, w * 112 / 512, 1);
  sp.userData.set = (t, b = bg) => {
    if (sp.userData.key === t + b) return; sp.userData.key = t + b;
    const g = c.getContext('2d'); g.clearRect(0, 0, 512, 112);
    g.fillStyle = b; g.beginPath();
    const r = 40; g.moveTo(r + 4, 4); g.arcTo(508, 4, 508, 108, r); g.arcTo(508, 108, 4, 108, r); g.arcTo(4, 108, 4, 4, r); g.arcTo(4, 4, 508, 4, r); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fitFont(g, t, 54, 470); g.fillText(t, 256, 60);
    tex.needsUpdate = true;
  };
  sp.userData.set(text);
  return sp;
}

function lobbyTick(now) {
  const dt = Math.min(0.05, (now - (lastLobbyT || now)) / 1000); lastLobbyT = now;
  lobbyGlobe.rotation.y += dt * 0.8; poseWalk(lobbyGlobe, (now / 1600) % 1);
  portals.forEach((pt, i) => { pt.glow.material.opacity = 0.25 + 0.15 * Math.sin(now / 400 + i); });
  updateGhosts(dt, now);
  if (!avatar) return;
  const yaw = cam.theta;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = -fz, rz = fx; // 화면 기준 앞/오른쪽
  let ix = 0, iz = 0;
  if (!inRoom() && !overlayOpen()) {
    if (lkeys.has('KeyW') || lkeys.has('ArrowUp')) iz += 1;
    if (lkeys.has('KeyS') || lkeys.has('ArrowDown')) iz -= 1;
    if (lkeys.has('KeyA') || lkeys.has('ArrowLeft')) ix -= 1;
    if (lkeys.has('KeyD') || lkeys.has('ArrowRight')) ix += 1;
  }
  const dir = new THREE.Vector3();
  if (ix || iz) { dir.set(fx * iz + rx * ix, 0, fz * iz + rz * ix).normalize(); av.target = null; av.onArrive = null; }
  else if (av.target) {
    dir.subVectors(av.target, av.pos); dir.y = 0;
    if (dir.length() < 0.2) { dir.set(0, 0, 0); av.target = null; const f = av.onArrive; av.onArrive = null; if (f) f(); }
    else dir.normalize();
  }
  const moving = dir.lengthSq() > 0;
  if (moving) {
    av.pos.addScaledVector(dir, 6.5 * dt);
    let r = Math.hypot(av.pos.x, av.pos.z);
    if (r > 15) av.pos.multiplyScalar(15 / r);
    if (r < 2.9) { if (r < 0.01) av.pos.set(0, 0, 2.9); else av.pos.multiplyScalar(2.9 / r); } // 분수에 부딪힘
    av.yaw = Math.atan2(dir.x, dir.z); av.phase += dt * 2.6;
    poseWalk(avatar, av.phase % 1);
  } else poseWalk(avatar, 0);
  if (av.y > 0 || av.vy > 0) { av.vy -= 22 * dt; av.y += av.vy * dt; if (av.y <= 0) { av.y = 0; av.vy = 0; } }
  avatar.position.set(av.pos.x, av.y > 0 ? av.y : moving ? Math.abs(Math.sin(av.phase * Math.PI * 2)) * 0.25 : 0, av.pos.z);
  let dy = av.yaw - avatar.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  avatar.rotation.y += dy * Math.min(1, dt * 12);
  // 포탈·상점에 들어가기
  if (!inRoom() && !overlayOpen() && now > zoneCool) {
    const pt = portals.find(p => Math.hypot(av.pos.x - p.pos.x, av.pos.z - p.pos.z) < 1.6);
    if (pt) { zoneCool = now + 1500; enterRoomFromLobby(pt.k); }
  }
  nearShop = !inRoom() && Math.hypot(av.pos.x - shopEntry.x, av.pos.z - shopEntry.z) < SHOP_NEAR;
  const showPrompt = nearShop && !overlayOpen();
  if ($('#shopPrompt').classList.contains('show') !== showPrompt) $('#shopPrompt').classList.toggle('show', showPrompt);
  // 카메라: 캐릭터 뒤 위쪽에서 따라감 (드래그 = 회전, 휠 = 거리)
  lobbyLook.lerp(av.pos, 0.1);
  const R = clamp(cam.r * 0.62, 8, 26), ph = clamp(cam.phi, 0.45, 1.2);
  lobbyCam.position.set(lobbyLook.x + R * Math.sin(ph) * Math.sin(yaw), R * Math.cos(ph) + 1.2, lobbyLook.z + R * Math.sin(ph) * Math.cos(yaw));
  lobbyCam.lookAt(lobbyLook.x, 1.2, lobbyLook.z);
}
function walkTo(p, cb) { if (inRoom()) return; av.target = p.clone().setY(0); av.onArrive = cb || null; }
function walkToRoom(k) { if (inRoom()) return; const pt = portals[k - 1]; walkTo(pt.entry, () => enterRoomFromLobby(k)); }
function lobbyClick(e) {
  if (overlayOpen()) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, lobbyCam);
  const hit = raycaster.intersectObjects(lobbyPickables, false)[0];
  if (!hit) return;
  const o = hit.object;
  if (o.userData.room) return walkToRoom(o.userData.room);
  if (o.userData.shop) return walkTo(shopEntry); // 걸어가기만, 여는 건 E키
  walkTo(hit.point);
}

// ---- 빈 방 확인 (각 방에 살짝 연결해서 인원만 물어봄)
function startProbe() {
  if (probe || typeof Peer === 'undefined') return;
  const pr = probe = new Peer();
  pr.on('open', () => { if (probe !== pr) return; probeAll(); probeIv = setInterval(probeAll, 5000); });
  pr.on('error', err => {
    if (probe !== pr) return;
    if (err.type === 'peer-unavailable') {
      const m = String(err.message || '').match(/lobby(\d)/);
      if (m) { roomInfo[m[1] - 1] = 'empty'; updateRoomViews(); }
    }
  });
  pr.on('disconnected', () => { if (probe === pr && !pr.destroyed) pr.reconnect(); });
}
function stopProbe() { clearInterval(probeIv); probeIv = null; if (probe) { try { probe.destroy(); } catch (e) {} probe = null; } }
function probeAll() {
  if (!lobbyOn || !probe || probe.disconnected) return;
  for (let k = 1; k <= 5; k++) {
    if (lobby && lobby.k === k && lobby.isHost) continue;
    let got = false;
    const conn = probe.connect(ROOM_ID(k), {reliable: true});
    conn.on('open', () => { try { conn.send({t: 'peek'}); } catch (e) {} });
    conn.on('data', d => {
      if (d && d.t === 'info') { got = true; roomInfo[k - 1] = {n: d.n | 0, max: d.max | 0, left: d.left | 0, started: !!d.started, colors: d.colors}; updateRoomViews(); }
      try { conn.close(); } catch (e) {}
    });
    setTimeout(() => { if (!got) { try { conn.close(); } catch (e) {} if (roomInfo[k - 1] == null) { roomInfo[k - 1] = 'empty'; updateRoomViews(); } } }, 4000);
  }
}

// =====================================================================
//  로비 광장: 다른 사람 캐릭터 보이기
//  - 로비에 먼저 온 사람이 '광장 중계'가 되어 모두의 위치를 모아 다시 나눠 줌

// =====================================================================
const PLAZA_ID = ROOM_PREFIX + 'plazaNet';
let plazaNet = null, plazaIv = null;

function myPlazaState(id) {
  return {id, n: profile.name, j: profile.job, c: profile.color, h: profile.hat, sh: profile.shape,
    x: +av.pos.x.toFixed(2), z: +av.pos.z.toFixed(2), y: +av.y.toFixed(2), r: +(avatar ? avatar.rotation.y : 0).toFixed(2)};
}
function cleanState(s) {

    h: SHOP_IDS.has(s.h) ? s.h : null, sh: SHAPES.has(s.sh) ? s.sh : 'ball',
    x: finite(s.x, -16, 16), z: finite(s.z, -16, 16), y: finite(s.y, 0, 5), r: finite(s.r, -20, 20)};
}
function startPlaza() {
  if (plazaNet || typeof Peer === 'undefined' || !profile) return;
  const pz = plazaNet = {peer: null, isHub: false, id: null, conns: new Map(), states: new Map(), hubConn: null};
  plazaTryHub(pz);
  plazaIv = setInterval(() => plazaSend(pz), 120);
}
function stopPlaza() {
  clearInterval(plazaIv); plazaIv = null;
  const pz = plazaNet; plazaNet = null;
  if (pz && pz.peer) try { pz.peer.destroy(); } catch (e) {}

}
function plazaRetry(pz) {

  pz.peer = null; pz.isHub = false; pz.hubConn = null; pz.id = null; pz.conns.clear(); pz.states.clear();
  clearGhosts();

}
// 먼저 중계를 맡아 보고, 이미 있으면 손님으로 붙음
function plazaTryHub(pz) {
  if (plazaNet !== pz) return;
  const peer = pz.peer = new Peer(PLAZA_ID);
  peer.on('open', id => { if (plazaNet !== pz || pz.peer !== peer) return; pz.isHub = true; pz.id = id; });

function plazaSend(pz) {

      obj.scale.setScalar(1.8); dressPawn(obj, s.h);
      const tag = makeLabel(`${s.n} · ${jobOf(s.j).n}`, 'rgba(30,41,59,.75)', 1.3); tag.position.y = 0.85; obj.add(tag);
      g = {obj, key, tag, x: old ? old.x : s.x, z: old ? old.z : s.z, y: 0, r: s.r, phase: 0};
      obj.position.set(g.x, 0, g.z);
      ghosts.set(s.id, g);
    }
    g.tx = s.x; g.tz = s.z; g.ty = s.y; g.tr = s.r;
  }
  for (const id of [...ghosts.keys()]) if (!seen.has(id)) removeGhost(id);
}
function removeGhost(id) {
  const g = ghosts.get(id); if (!g) return;
  lobbyScene.remove(g.obj); g.tag.material.map.dispose(); g.tag.material.dispose();
  ghosts.delete(id);
}
function clearGhosts() { for (const id of [...ghosts.keys()]) removeGhost(id); }
// 받은 위치로 부드럽게 따라감 (걷는 모양도)
function updateGhosts(dt, now) {
  const k = Math.min(1, dt * 10);
  for (const g of ghosts.values()) {
    if (g.tx == null) continue;
    const dx = g.tx - g.x, dz = g.tz - g.z, moving = Math.hypot(dx, dz) > 0.03;
    g.x += dx * k; g.z += dz * k; g.y += (g.ty - g.y) * Math.min(1, dt * 15);
    let dr = g.tr - g.obj.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    g.obj.rotation.y += dr * k;
    if (moving) { g.phase += dt * 2.6; poseWalk(g.obj, g.phase % 1); } else poseWalk(g.obj, 0);
    g.obj.position.set(g.x, g.y > 0.01 ? g.y : moving ? Math.abs(Math.sin(g.phase * Math.PI * 2)) * 0.25 : 0, g.z);
  }
}

// ---- 로비 보이기/숨기기
function showLobby() {
  lobbyOn = true; document.body.classList.add('inLobby');
  $('#lobbyUI').style.display = 'block';
  cam.theta = 0; cam.phi = 0.95; cam.r = 22;
  buildAvatar(); updateLobbyTop(); startProbe(); startPlaza(); updateRoomViews();
}
function hideLobby() {
  if (!lobbyOn) return;
  lobbyOn = false; document.body.classList.remove('inLobby');
  $('#lobbyUI').style.display = 'none'; $('#shopWrap').style.display = 'none';
  lkeys.clear(); stopProbe(); stopPlaza();
}
$('#lbShopBtn').onclick = () => { walkTo(shopEntry); toast('🛒 상점으로 걸어가요! 도착하면 E키를 누르세요'); };
$('#lbLocalBtn').onclick = () => { if (inRoom()) return; lkeys.clear(); renderRows(); $('#setup').style.display = 'flex'; };
$('#setupBack').onclick = () => { setMode('local'); $('#setup').style.display = 'none'; };

// =====================================================================
//  인트로: 닉네임 정하기(한 번만) → 시작하기 → 로비
// =====================================================================
function showIntro() {
  const b = $('#introBody');
  if (profile) b.innerHTML = `<div style="font-size:18px;margin:14px 0 4px">👋 <b>${esc(profile.name)}</b> 님, 어서 오세요!</div><div class="coinBig">🪙 ${profile.coins} 코인</div>`;
  else b.innerHTML = `<label class="l" style="text-align:left">닉네임</label>
    <input id="nickIn" maxlength="10" placeholder="닉네임 입력 (최대 10자)" autocomplete="off">
    <div class="netMsg">⚠️ 닉네임은 나중에 상점의 <b>닉네임 변경권(🪙${RENAME_PRICE})</b>으로만 바꿀 수 있어요.</div>`;
  const nick = $('#nickIn');
  if (nick) { nick.onkeydown = e => { if (e.key === 'Enter') introGo(); }; setTimeout(() => nick.focus(), 50); }
  $('#introBtn').onclick = introGo;
}
async function introGo() {
  if (!profile) {
    const name = ($('#nickIn').value || '').trim().slice(0, 10);
    const msg = $('#introMsg');
    if (!name) { msg.textContent = '닉네임을 입력하세요'; msg.classList.add('err'); return; }
    $('#intro').style.display = 'none';
    const ok = await modal(`<div class="card"><div class="em">📛</div><h3>${esc(name)}</h3><div>이 닉네임으로 정할까요?<br><b>바꾸려면 닉네임 변경권(🪙${RENAME_PRICE})이 필요해요!</b></div></div>`,
      [{label: '✅ 정하기', value: 1, cls: 'gold'}, {label: '다시 쓰기', value: 0}]);
    if (!ok) { $('#intro').style.display = 'flex'; return; }
    profile = {name, coins: 0, owned: [], hat: null, color: PALETTE[0][0], job: 'newbie', shape: 'ball', tickets: 0};
    saveProfile();
  }
  $('#intro').style.display = 'none';
  enterLobby();
}
function enterLobby() {
  setupCfg[0].name = profile.name; setupCfg[0].color = profile.color;
  setupCfg.slice(1).forEach(c => {
    if (c.color === profile.color) c.color = PALETTE.map(x => x[0]).find(h => !setupCfg.some(o => o.color === h));
  });
  renderRows();
  showLobby();
  // 초대 링크(#room=코드)로 열었으면 바로 코드 참가 화면으로
  const m = location.hash.match(/room=([A-Z0-9]{5})/i);
  if (m) { $('#setup').style.display = 'flex'; setMode('join'); $('#joinCode').value = m[1].toUpperCase(); }
}
loadProfile();
showIntro();

</script>
